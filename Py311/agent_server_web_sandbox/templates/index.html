<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Agent Console</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #1e1e2e; 
            color: #cdd6f4; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-sizing: border-box; 
        }
        
        /* Otsikkopalkki */
        .header-bar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px;
        }
        .header-bar h2 { margin: 0; color: #b4befe; font-size: 22px; }
        .header-buttons { display: flex; gap: 10px; }

        /* Pääkontti - Kiinteät suhteet Flexillä ilman vaaraa sivuttaisesta leviämisestä */
        .main-container { 
            display: flex; 
            flex: 1; 
            gap: 20px; 
            min-height: 0; 
            width: 100%;
        }
        
        /* Vakioleveydet: Chat 75% (3/4 osaa), Telemetry 25% (1/4 osaa) */
        .chat-section { 
            flex: 0 0 75%; 
            display: flex; 
            flex-direction: column; 
            background: #252538; 
            border-radius: 8px; 
            padding: 15px; 
            box-sizing: border-box; 
        }
        .telemetry-section { 
            flex: 0 0 25%; 
            display: flex; 
            flex-direction: column; 
            background: #181825; 
            border-radius: 8px; 
            padding: 15px; 
            box-sizing: border-box; 
            border-left: 4px solid #89b4fa; 
        }
        
        h3 { margin-top: 0; color: #89b4fa; border-bottom: 1px solid #45475a; padding-bottom: 5px; font-size: 16px; }
        
        /* Chat-tulostelaatikko */
        #chat-output { 
            flex: 1; 
            overflow-y: auto; 
            background: #11111b; 
            border-radius: 6px; 
            padding: 15px; 
            margin-bottom: 15px; 
            font-family: monospace; 
            font-size: 14px; 
            box-sizing: border-box;
        }
        
        /* Telemetrian tulostelaatikko */
        #telemetry-output { 
            flex: 1; 
            overflow-y: auto; 
            background: #11111b; 
            border-radius: 6px; 
            padding: 15px; 
            font-family: monospace; 
            font-size: 12px; 
            color: #a6e3a1; 
            box-sizing: border-box;
        }

        /* Erilliset viestikuplat (Vanhasta versiosta paranneltuna) */
        .message-block {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            position: relative;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .user-message {
            background: #313244;
            border-left: 4px solid #b4befe;
            color: #cdd6f4;
        }
        .agent-message {
            background: #1e1e2e;
            border-left: 4px solid #a6e3a1;
            color: #cdd6f4;
        }
        
        /* Kopiointinappi agentin kuplille */
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #45475a;
            color: #cdd6f4;
            border: none;
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 1; background: #585b70; }

        /* Syöttöalueen pääkontti - asettaa tekstialueen ja napit vierekkäin */
        .input-container { 
            display: flex; 
            flex-direction: row; /* Muutettu: sisältö vierekkäin */
            gap: 12px; 
            background: #11111b;
            padding: 12px;
            border-radius: 6px;
            align-items: stretch; /* Venyttää napit saman korkuiseksi kuin textarea */
        }
        
        /* Suurennettu tekstialue - joustaa viemään vapaan tilan vasemmalla */
        textarea { 
            flex: 1; /* Vie kaiken vapaan tilan vasemmalta */
            height: 152px; /* Korkeus sovitettu kahdelle napille */
            background: #313244; 
            border: 1px solid #45475a; 
            border-radius: 6px; 
            color: #cdd6f4; 
            padding: 10px; 
            font-size: 14px; 
            resize: none;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea:focus { outline: 1px solid #89b4fa; }
        
        /* Painikesarake oikealla puolella - asettaa napit alekkain */
        .button-column {
            display: flex;
            flex-direction: column; /* Alekkain */
            gap: 8px; /* Väli nappien välissä */
            justify-content: space-between;
            flex-shrink: 0; /* Estää nappien koon muuttumisen */
        }

        /* Varmistetaan että molemmat napit ovat saman levyisiä sarakkeessa */
        .button-column button {
            width: 150px; /* Kiinteä leveys napeille, voit muuttaa tarvittaessa */
            height: 68px; /* Korkeus jaettu tasan */
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Painikkeiden tyylittelyt */
        button { 
            background: #89b4fa; 
            border: none; 
            color: #11111b; 
            padding: 10px 18px; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 13px;
        }
        button:hover { background: #b4befe; }
        .btn-secondary { background: #45475a; color: #cdd6f4; }
        .btn-secondary:hover { background: #585b70; }
        #abort-btn { background: #f38ba8; }
        #abort-btn:hover { background: #e06c75; }
        
        /* Telemetrian tilatunnisteet */
        .system-status { color: #fab387; font-style: italic; margin-bottom: 8px; font-size: 11px; }
        .tool-log { color: #f9e2af; margin: 6px 0; padding-left: 8px; border-left: 2px solid #f9e2af; }
        .tool-res { color: #94e2d5; margin-bottom: 12px; padding-left: 8px; font-size: 11px; opacity: 0.95; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2>🤖 Local Agent Workspace</h2>
        <div class="header-buttons">
            <button class="btn-secondary" onclick="clearMemory()">Tyhjennä muisti</button>
            <button class="btn-secondary" onclick="memorizeContext()">Pakota muistiin tallennus</button>
            <button id="abort-btn" onclick="abortAgent()">ABORT</button>
        </div>
    </div>

    <div class="main-container">
        <!-- CHATOSIO (75% Kiinteä leveys) -->
        <div class="chat-section">
            <h3>Keskustelu (Reaaliaikainen)</h3>
            <div id="chat-output"></div>
            
            <!-- Suurennettu tekstinsyöttöalue painikkeet oikealla puolella alekkain -->
            <div class="input-container">
                <textarea id="user-input" placeholder="Kirjoita viesti tai anna kuvan polku muodossa 'image:C:/kuva.png kerro tästä'...\nLähetä painamalla Ctrl+Enter tai klikkaamalla Lähetä." onkeydown="if(event.key==='Enter' && event.ctrlKey) { event.preventDefault(); sendMessage(); }"></textarea>
                
                <div class="button-column">
                    <button class="btn-secondary" onclick="triggerFileUpload()">📎 Liitä tiedosto</button>
                    <button onclick="sendMessage()">Lähetä</button>
                </div>
                
                <!-- Piilotettu input tiedostojen valintaa varten -->
                <input type="file" id="hidden-file-input" style="display: none;" onchange="handleFileSelection()">
            </div>

        </div>

        <!-- TELEMETRIAOSIO (25% Kiinteä leveys) -->
        <div class="telemetry-section">
            <h3>Työkalujen suoritusloki (Telemetry)</h3>
            <div id="telemetry-output"></div>
        </div>
    </div>

    <script>
        const chatOutput = document.getElementById('chat-output');
        const telemetryOutput = document.getElementById('telemetry-output');
        const userInput = document.getElementById('user-input');
        const hiddenFileInput = document.getElementById('hidden-file-input');

        let currentAgentBubble = null; // Pitää kirjaa parhaillaan striimattavasta agentin kuplasta

        function appendTelemetry(htmlContent) {
            telemetryOutput.innerHTML += htmlContent;
            telemetryOutput.scrollTop = telemetryOutput.scrollHeight;
        }

        // Kopiointitoiminto viestikuplille
        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const oldText = btn.textContent;
                btn.textContent = "Kopioitu!";
                setTimeout(() => { btn.textContent = oldText; }, 2000);
            });
        }

        // Luo uuden tyylitellyn viestilohkon chat-ikkunaan
        function createMessageBlock(role, initialText = "") {
            const block = document.createElement('div');
            block.className = `message-block ${role}-message`;
            
            const textSpan = document.createElement('span');
            textSpan.className = "text-content";
            textSpan.textContent = initialText;
            block.appendChild(textSpan);

            if (role === 'agent') {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = 'Kopioi';
                copyBtn.onclick = () => copyToClipboard(textSpan.textContent, copyBtn);
                block.appendChild(copyBtn);
            }

            chatOutput.appendChild(block);
            chatOutput.scrollTop = chatOutput.scrollHeight;
            return textSpan;
        }

        // Avaa tiedostonvalintaikkunan
        function triggerFileUpload() {
            hiddenFileInput.click();
        }

        // Käsittelee valitun tiedoston ja lisää sen polun tekstialueeseen (kuten vanhassa versiossa)
        async function handleFileSelection() {
            if (!hiddenFileInput.files.length) return;
            const file = hiddenFileInput.files[0];
            
            appendTelemetry(`<div class="system-status">📤 Ladataan tiedostoa: ${file.name}...</div>`);
            
            const formData = new FormData();
            formData.append("file", file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.status === "success") {
                    appendTelemetry(`<div class="system-status">✅ Tiedosto ladattu onnistuneesti palvelimelle!</div>`);
                    // Jos kyseessä on kuva, käytetään image: syntaksia, muuten liitetään polku sellaisenaan
                    if (data.is_image) {
                        userInput.value += `image:${data.local_path} `;
                    } else {
                        userInput.value += `${data.local_path} `;
                    }
                    userInput.focus();
                } else {
                    appendTelemetry(`<div style="color:#f38ba8;">❌ Lataus epäonnistui: ${data.error}</div>`);
                }
            } catch (err) {
                console.error(err);
                appendTelemetry(`<div style="color:#f38ba8;">❌ Virhe tiedonsiirrossa ladattaessa tiedostoa.</div>`);
            }
            // Nollataan valinta, jotta sama tiedosto voidaan valita heti uudelleen
            hiddenFileInput.value = "";
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            userInput.value = '';
            
            // Luodaan käyttäjän viestikupla
            createMessageBlock('user', `User: ${message}`);
            
            // Valmistellaan agentin viestikuplan paikka tulevaa striimiä varten
            appendTelemetry(`<div class="system-status">[${new Date().toLocaleTimeString()}] Lähetetään viesti...</div>`);
            currentAgentBubble = createMessageBlock('agent', 'Agent: ');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.body) {
                    currentAgentBubble.textContent += "\n[Virhe: Striimausta ei tueta palvelimelta]";
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const parts = buffer.split("\n\n");
                    buffer = parts.pop();

                    for (const part of parts) {
                        if (!part.trim()) continue;
                        
                        const lines = part.split("\n");
                        let eventType = "";
                        let dataContent = "";

                        for (const line of lines) {
                            if (line.startsWith("event:")) eventType = line.replace("event:", "").trim();
                            if (line.startsWith("data:")) dataContent = line.replace("data:", "").trim();
                        }

                        if (!dataContent) continue;
                        
                        try {
                            const parsed = JSON.parse(dataContent);
                            const payload = parsed.data;

                            if (eventType === "response") {
                                // Päivitetään olemassa olevaa agentin kuplaa kirjain kirjaimelta
                                currentAgentBubble.textContent += payload;
                                chatOutput.scrollTop = chatOutput.scrollHeight;
                            } else if (eventType === "status") {
                                appendTelemetry(`<div class="system-status">ℹ️ ${payload}</div>`);
                            } else if (eventType === "tool_call") {
                                appendTelemetry(`<div class="tool-log">🛠️ <b>Kutsutaan työkalua:</b> ${payload.name}<br><small>Argumentit: ${JSON.stringify(payload.args)}</small></div>`);
                            } else if (eventType === "tool_result") {
                                const shortRes = payload.result.length > 400 ? payload.result.substring(0, 400) + "..." : payload.result;
                                appendTelemetry(`<div class="tool-res">✅ <b>Tulos [${payload.name}]:</b> <pre style="margin:4px 0; background:#0b0b11; padding:6px; border-radius:4px; overflow-x:auto;">${shortRes}</pre></div>`);
                            } else if (eventType === "error") {
                                appendTelemetry(`<div style="color:#f38ba8;">❌ Virhe: ${payload}</div>`);
                            } else if (eventType === "done") {
                                appendTelemetry(`<div class="system-status">🏁 Suoritus valmis.</div>`);
                            }
                        } catch (e) {
                            console.error("Palasen käsittelyvirhe: ", e);
                        }
                    }
                }

            } catch (error) {
                console.error("Yhteysvirhe:", error);
                appendTelemetry(`<div style="color:#f38ba8;">❌ Yhteysvirhe palvelimeen.</div>`);
            }
        }

        async function abortAgent() {
            appendTelemetry(`<div style="color:#f38ba8;">🛑 Pyydetään suorituksen keskeytystä...</div>`);
            await fetch('/api/abort', { method: 'POST' });
        }

        async function clearMemory() {
            if(confirm("Haluatko varmasti tyhjentää istunnon muistin?")) {
                await fetch('/api/clear', { method: 'POST' });
                chatOutput.innerHTML = "";
                createMessageBlock('agent', "Istunnon muisti nollattu. Valmiina uusiin tehtäviin.");
                telemetryOutput.innerHTML = `<div class="system-status">Muisti nollattu.</div>`;
            }
        }

        async function memorizeContext() {
            appendTelemetry(`<div class="system-status">🧠 Tiivistetään ja tallennetaan nykyistä kontekstia pitkäaikaismuistiin...</div>`);
            const res = await fetch('/api/memorise', { method: 'POST' });
            const data = await res.json();
            appendTelemetry(`<div class="system-status">✅ Tallennettu! Tiivistelmä: ${data.summary}</div>`);
        }
    </script>
</body>
</html>
